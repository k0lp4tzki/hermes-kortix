# yaml-language-server: $schema=https://kortix.com/schema/kortix.schema.json
#
# Amber Comet: the Kortix project manifest. Agents, what each may use,
# triggers and sandboxes live here, committed beside your files.
# Reference: https://kortix.com/docs/developers#kortixyaml-reference

project:
  name: "Amber Comet"
  description: A Kortix project.

# Built-in agents. My Kortix, the agent you talk to, routes each task to the
# right agent below. Delete this key or set it to false to leave it out.
builtin_agents:
  my_kortix: true

# The agent a session or trigger runs when it names none. My Kortix starts
# `worker` when it names no agent.
default_agent: mykortix

# Project skills: folders under skills/, registered by name. Each agent then
# enables them with its own `skills:` grant.
skills:
  agent-browser: skills/agent-browser
  convert-documents-to-markdown: skills/convert-documents-to-markdown
  design-foundations: skills/design-foundations
  docx: skills/docx
  pdf: skills/pdf
  presentations: skills/presentations
  web-publishing-and-deployments: skills/web-publishing-and-deployments
  webapp: skills/webapp
  website-building: skills/website-building
  xlsx: skills/xlsx

agents:
  worker:
    description: "General-purpose worker: coding, research, writing, ops and data work, done end to end in its own sandbox."
    mode: primary
    permission: allow
    prompt_file: agents/worker.md
    # "*" is every name (quoted: a bare * is a YAML alias). `all` means the same.
    tools: "*"
    skills: "*"
    connectors: "*"
    secrets: "*"
    kortix_permissions: "*"
    workspace: { project_repository: true }

  seucrity-agent:
    description: "Reviews every change request for security before it reaches main: finds vulnerabilities, unsafe defaults and leaked secrets, proves them, and says exactly how to fix them. Never writes product code."
    # all: a person can start it directly, and other agents can delegate a CR review to it.
    mode: all
    prompt_file: agents/seucrity-agent.md
    # Read-only reviewer: no edit/write (fixes go in the review as suggested
    # patches), no image_gen, no agent/subagents. bash runs git, read-only
    # kortix CLI calls, scanners, tests and local proofs; the web tools look up CVEs.
    tools: [read, grep, glob, bash, web_search, scrape_webpage]
    permission:
      edit: deny
      bash:
        "*": allow
        "git push*": deny
        "git commit*": deny
        "git merge*": deny
        "git rebase*": deny
        "git reset --hard*": deny
        "git tag*": deny
        "git branch -d*": deny
        "git branch -D*": deny
        "git branch --delete*": deny
        "kortix cr open*": deny
        "kortix cr merge *": deny
        "kortix cr close*": deny
        "kortix cr reopen*": deny
        "kortix cr request-changes*": deny
        "kortix review act*": deny
        "kortix review bulk*": deny
        "kortix secrets*": deny
        "kortix connectors*": deny
        "kortix triggers*": deny
        "kortix agents*": deny
        "kortix apps*": deny
        "kortix projects*": deny
        "gh *": deny
    skills: [kortix-system, kortix-cli]
    subagents: none
    connectors: none
    secrets: none
    # Read the project, CRs and diffs; read the review inbox and submit a
    # review there for human sign-off. No push, merge, close, secret or agent writes.
    kortix_permissions: [project.read, project.gitops.read, project.review.read, project.review.submit]
    # Checkout so it can read the code around a diff and fetch the CR branch.
    # Pushing is impossible without project.gitops.push and denied in bash above.
    workspace: { project_repository: true }

# More you can add here, each with an example in the reference:
#   sandbox.templates   a custom image or Dockerfile for sessions
#   tools               your own, registered by name, then enabled per agent
#   triggers            run an agent on a schedule or an event
